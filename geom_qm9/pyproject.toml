[project]
name = "geom-qm9-drift"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "msgpack>=1.1,<2",
    "numpy>=2.1,<3",
    "rdkit>=2024.9,<2026",
    "torch==2.9.0",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
