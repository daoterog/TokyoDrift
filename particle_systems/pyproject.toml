[project]
name = "particle-drift-benchmarks"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.1,<3",
]

[dependency-groups]
cpu = ["torch==2.9.0"]
cuda = ["torch==2.9.0"]
dev = ["ruff>=0.12,<1"]
alanine = ["h5py>=3.12,<4", "openmm>=8.2,<9"]

[tool.uv]
package = false
default-groups = ["cpu", "dev"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", group = "cuda" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "ANN", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1", "ANN", "N806", "B023"]
